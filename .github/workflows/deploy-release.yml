name: Deploy release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to update
        required: true
        default: v1.0.16

permissions:
  contents: write

concurrency:
  group: deploy-release
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GH_TOKEN: ${{ github.token }}
      CITOOL_CLI_REPOSITORY: coloz/arduino-ci130x
      CITOOL_CLI_RELEASE_TAG: citool-cli-v1.2.2
      CITOOL_CLI_VERSION: 1.2.2
      NUCLEI_GCC_RELEASE_TAG: v1.0.10
      NUCLEI_GCC_VERSION: 9.2.0
      NUCLEI_GCC_WINDOWS_SHA256: f5e11a1fb9fe806ed68cf0c5e3db9356d61314137f1ef3bc430a447fc832ba4b
      NUCLEI_GCC_LINUX_SHA256: 2e24642906cd0c11ff1cc85ebd1b058d18ea75893f9c62f7077c7a65374ca268
      NUCLEI_GCC_MACOS_SHA256: 29b22c8db6a555e86e64d79d61c4275b0451f97ccb652eda55fee86a6a694221

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Prepare release metadata
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version=//p' platform.txt | head -n 1)"
          if [[ -z "$version" ]]; then
            echo 'platform.txt does not contain a version entry.' >&2
            exit 1
          fi

          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          if [[ "$tag" != "v${version}" ]]; then
            echo "Release tag '$tag' does not match platform version '$version'." >&2
            exit 1
          fi
          asset="arduino-ci130x-${version}.zip"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Run host regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_hardware_serial_rx.py
          mkdir -p "$RUNNER_TEMP/ci13xx-tests"
          g++ -std=c++14 -Wall -Wextra -Werror -pedantic \
            -Ilibraries/EEPROM/tests/fakes -Itools/sdk/include \
            libraries/EEPROM/tests/runtime_test.cpp \
            -o "$RUNNER_TEMP/ci13xx-tests/eeprom"
          "$RUNNER_TEMP/ci13xx-tests/eeprom"

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          git archive \
            --format=zip \
            --prefix="arduino-ci130x-${{ steps.release.outputs.version }}/" \
            --output="dist/${{ steps.release.outputs.asset }}" \
            "$GITHUB_SHA" \
            boards.txt \
            platform.txt \
            programmers.txt \
            README.md \
            cores \
            examples \
            libraries \
            variants \
            recursos/manifest.json \
            recursos/asr.bin \
            recursos/dnn.bin \
            recursos/voice.bin \
            recursos/user_file.bin \
            recursos/cwsl/manifest.json \
            recursos/cwsl/asr.bin \
            recursos/cwsl/dnn.bin \
            recursos/cwsl/voice.bin \
            recursos/cwsl/user_file.bin \
            tools/sdk \
            tools/compile_sdk_sources.py \
            tools/compile_sdk_sources.ps1 \
            tools/merge_user_file_entries.py \
            tools/merge_user_file_entries.ps1 \
            tools/postbuild.py \
            tools/postbuild.ps1 \
            tools/prepare_resources.py \
            tools/prepare_resources.ps1

          archive="dist/${{ steps.release.outputs.asset }}"
          archive_prefix="arduino-ci130x-${{ steps.release.outputs.version }}"
          archive_entries="$(unzip -Z1 "$archive")"

          if grep -Eq '/(\.agent|\.agents|\.git|\.github|package)(/|$)' \
            <<< "$archive_entries"; then
            echo 'Release archive contains repository-only metadata.' >&2
            exit 1
          fi

          runtime_hooks=(
            tools/compile_sdk_sources.py
            tools/compile_sdk_sources.ps1
            tools/merge_user_file_entries.py
            tools/merge_user_file_entries.ps1
            tools/postbuild.py
            tools/postbuild.ps1
            tools/prepare_resources.py
            tools/prepare_resources.ps1
          )
          for hook in "${runtime_hooks[@]}"; do
            if ! grep -Fxq "$archive_prefix/$hook" <<< "$archive_entries"; then
              echo "Release archive is missing runtime hook: $hook" >&2
              exit 1
            fi
          done

      - name: Download citool-cli release archives
        shell: bash
        run: |
          set -euo pipefail

          archives=(
            "citool-cli-${CITOOL_CLI_VERSION}-windows-x86_64.zip"
            "citool-cli-${CITOOL_CLI_VERSION}-macos-universal.tar.gz"
            "citool-cli-${CITOOL_CLI_VERSION}-linux-x86_64.tar.gz"
          )
          patterns=()
          for archive in "${archives[@]}"; do
            patterns+=(--pattern "$archive" --pattern "$archive.sha256")
          done
          gh release download "$CITOOL_CLI_RELEASE_TAG" \
            --repo "$CITOOL_CLI_REPOSITORY" \
            --dir dist \
            "${patterns[@]}"


      - name: Download Nuclei GCC host archives
        shell: bash
        run: |
          set -euo pipefail

          archives=(
            "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-windows.zip"
            "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-linux-x86_64.tar.gz"
            "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-macos-arm64.tar.gz"
          )
          patterns=()
          for archive in "${archives[@]}"; do
            patterns+=(--pattern "$archive" --pattern "$archive.sha256")
          done
          gh release download "$NUCLEI_GCC_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            "${patterns[@]}"

      - name: Verify and checksum release assets
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          sha256sum --check ./*.sha256
          echo "${NUCLEI_GCC_WINDOWS_SHA256}  riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-windows.zip" | sha256sum --check -
          echo "${NUCLEI_GCC_LINUX_SHA256}  riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-linux-x86_64.tar.gz" | sha256sum --check -
          echo "${NUCLEI_GCC_MACOS_SHA256}  riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-macos-arm64.tar.gz" | sha256sum --check -
          unzip -Z1 "citool-cli-${CITOOL_CLI_VERSION}-windows-x86_64.zip" \
            | tr '\\' '/' \
            | grep -Fx 'citool-cli/citool-cli.exe' >/dev/null
          tar -tzf "citool-cli-${CITOOL_CLI_VERSION}-macos-universal.tar.gz" \
            | sed 's#^\./##' | grep -Fx 'citool-cli/citool-cli' >/dev/null
          tar -tzf "citool-cli-${CITOOL_CLI_VERSION}-linux-x86_64.tar.gz" \
            | sed 's#^\./##' | grep -Fx 'citool-cli/citool-cli' >/dev/null
          unzip -Z1 "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-windows.zip" \
            | tr '\\' '/' \
            | grep -Fx 'gcc_fix_raissrc/bin/riscv-nuclei-elf-gcc.exe' >/dev/null
          unzip -Z1 "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-windows.zip" \
            | tr '\\' '/' \
            | grep -Fx 'gcc_fix_raissrc/riscv-nuclei-elf/include/assert.h' >/dev/null
          unzip -Z1 "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-windows.zip" \
            | tr '\\' '/' \
            | grep -Fx 'gcc_fix_raissrc/riscv-nuclei-elf/lib/rv32imafc/ilp32f/libc_nano.a' >/dev/null
          test "$(unzip -Z1 "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-windows.zip" | wc -l)" -ge 2000
          tar -tzf "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-linux-x86_64.tar.gz" \
            | sed 's#^\./##' | grep -Fx 'riscv-gcc/bin/riscv-nuclei-elf-gcc' >/dev/null
          tar -tzf "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-linux-x86_64.tar.gz" \
            | sed 's#^\./##' | grep -Fx 'riscv-gcc/riscv-nuclei-elf/include/assert.h' >/dev/null
          tar -tzf "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-linux-x86_64.tar.gz" \
            | sed 's#^\./##' | grep -Fx 'riscv-gcc/riscv-nuclei-elf/lib/rv32imafc/ilp32f/libc_nano.a' >/dev/null
          test "$(tar -tzf "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-linux-x86_64.tar.gz" | wc -l)" -ge 2000
          tar -tzf "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-macos-arm64.tar.gz" \
            | sed 's#^\./##' | grep -Fx 'riscv-gcc/bin/riscv-nuclei-elf-gcc' >/dev/null
          tar -tzf "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-macos-arm64.tar.gz" \
            | sed 's#^\./##' | grep -Fx 'riscv-gcc/riscv-nuclei-elf/include/assert.h' >/dev/null
          tar -tzf "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-macos-arm64.tar.gz" \
            | sed 's#^\./##' | grep -Fx 'riscv-gcc/riscv-nuclei-elf/lib/rv32imafc/ilp32f/libc_nano.a' >/dev/null
          test "$(tar -tzf "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-macos-arm64.tar.gz" | wc -l)" -ge 2000
          if unzip -Z1 "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-windows.zip" \
              | grep -E '(^|/)\._|(^|/)\.DS_Store$' >/dev/null; then
            echo 'Windows GCC archive contains macOS metadata.' >&2
            exit 1
          fi
          for archive in \
            "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-linux-x86_64.tar.gz" \
            "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-macos-arm64.tar.gz"; do
            if tar -tzf "$archive" | grep -E '(^|/)\._|(^|/)\.DS_Store$' >/dev/null; then
              echo "$archive contains macOS metadata." >&2
              exit 1
            fi
          done

          sha256sum '${{ steps.release.outputs.asset }}' > SHA256SUMS.txt

      - name: Generate Boards Manager index
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PLATFORM_ASSET: ${{ steps.release.outputs.asset }}
          PLATFORM_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path('dist')
          index = json.loads(Path('package/package_chipintelli_index.template.json').read_text(encoding='utf-8'))
          release_base = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
              f"{os.environ['RELEASE_TAG']}"
          )

          def metadata(name, base_url=release_base):
              path = dist / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              return {
                  'url': f'{base_url}/{name}',
                  'archiveFileName': name,
                  'checksum': f'SHA-256:{digest}',
                  'size': str(path.stat().st_size),
              }

          package = index['packages'][0]
          package['email'] = 'support@chipintelli.com'
          platform = package['platforms'][0]
          platform['version'] = os.environ['PLATFORM_VERSION']
          platform.update(metadata(os.environ['PLATFORM_ASSET']))

          tool_release_bases = {
              'riscv-gcc': (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
                  f"{os.environ['NUCLEI_GCC_RELEASE_TAG']}"
              ),
              'citool-cli': (
                  f"https://github.com/{os.environ['CITOOL_CLI_REPOSITORY']}/releases/download/"
                  f"{os.environ['CITOOL_CLI_RELEASE_TAG']}"
              ),
          }
          for tool in package['tools']:
              for system in tool['systems']:
                  system.update(metadata(system['archiveFileName'], tool_release_bases[tool['name']]))

          output = json.dumps(index, indent=2, ensure_ascii=False) + '\n'
          if '__' in output:
              raise SystemExit('Boards Manager index still contains template placeholders.')
          (dist / 'package_chipintelli_index.json').write_text(output, encoding='utf-8', newline='\n')
          PY

          cd dist
          sha256sum package_chipintelli_index.json >> SHA256SUMS.txt
          if [[ "$RELEASE_TAG" == "$NUCLEI_GCC_RELEASE_TAG" ]]; then
            sha256sum \
              "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-windows.zip" \
              "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-linux-x86_64.tar.gz" \
              "riscv-nuclei-elf-gcc-${NUCLEI_GCC_VERSION}-macos-arm64.tar.gz" \
              >> SHA256SUMS.txt
          fi

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<'EOF'
          ## 主要更新

          - 新增美的空调离线语音遥控示例 `ChipIntelliIR > MideaVoiceAirConditioner`，附带语音及红外码库资源，支持“小智小智”唤醒、开关机、制冷制热、温度、风速、睡眠和本地一小时关机定时；串口匹配的美的码组可保存到 Flash。
          - `ChipIntelliIR` 增加 NEC 接收解码和重复帧识别，完善板级默认引脚、空调异步发送状态、码组校验以及红外数据库完整性检查。
          - 改进 `ChipIntelliCWSL` 自学习操作、事件队列、状态与错误诊断，并完善示例及资源。
          - 修复 EEPROM 缓冲调整、失败后的数据保留与重试，并对 NVDM 提交执行回读验证。
          - 为 CI1306、CI-D06GT01D 和 easyVoice 开发板增加内置 RC / 外部晶振时钟源菜单，改善串口批量接收及溢出诊断。
          - 继续复用 `v1.0.10` 发布的 Nuclei GCC 9.2.0 三平台工具包和 `citool-cli-v1.2.2` 工具包；本 release 不重复上传编译器或 CLI 资产。

          ## 验证

          - 美的示例已在 Windows 完成 easyVoice 默认配置编译、固件分区及资源校验、COM30 烧录和 CRC 校验；串口确认语音及美的码库初始化成功。空调实际接收、语音声学效果和不同机型兼容性仍需现场验证。
          - EEPROM 主机回归通过 18 组、97,626 次检查；发布工作流重新执行 EEPROM 与串口批量接收回归。
          - Arduino 平台版本、归档结构与运行时脚本由发布工作流校验。
          - Windows x86_64、macOS Universal（Intel + Apple Silicon）和 Linux x86_64 公共工具包由发布工作流校验版本、结构和 SHA-256。
          - Arduino 平台归档、公共工具依赖和 Boards Manager 索引由发布工作流统一校验后生成。

          ## 使用提示

          - 美的示例红外发射模块接 PA2，串口为 115200；说“小智小智”唤醒后，再说“打开空调”“开启制冷”或“设置二十六度”。首次无响应时，通过串口 `s` 搜索、`y` 保存、`x` 取消。
          - 本平台仍为开发预览版。该发布包不包含 WiFi、BLE 和 ESPLink 外接模块库。
          EOF

          release_assets=(
            "dist/${{ steps.release.outputs.asset }}"
            dist/package_chipintelli_index.json
            dist/SHA256SUMS.txt
          )

          if gh release view '${{ steps.release.outputs.tag }}' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload '${{ steps.release.outputs.tag }}' \
              "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit '${{ steps.release.outputs.tag }}' \
              --repo "$GITHUB_REPOSITORY" \
              --title "ChipIntelli CI130X Arduino v${{ steps.release.outputs.version }}" \
              --notes-file release-notes.md \
              --draft=false \
              --latest
          else
            gh release create '${{ steps.release.outputs.tag }}' \
              "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ChipIntelli CI130X Arduino v${{ steps.release.outputs.version }}" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Update stable Boards Manager index
        shell: bash
        run: |
          set -euo pipefail

          generated_index="$RUNNER_TEMP/package_chipintelli_index.json"
          cp dist/package_chipintelli_index.json "$generated_index"

          git fetch origin main
          git checkout -B main origin/main
          cp "$generated_index" package/package_chipintelli_index.json

          if git diff --quiet -- package/package_chipintelli_index.json; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package/package_chipintelli_index.json
          git commit -m 'Update Boards Manager index for v${{ steps.release.outputs.version }}'
          git push origin main
