name: Build Nuclei GCC host tools

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag used for the immutable host-tool archives
        required: true
        default: nuclei-gcc-v9.2.0-host1
        type: string
      publish:
        description: Publish or update the GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nuclei-gcc-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  TOOLCHAIN_VERSION: 9.2.0
  NUCLEI_SOURCE_TAG: v9.2RC
  WINDOWS_ARCHIVE_SHA256: 044381414264899a701d20bbd75e2add76bd86112b02d33b6d5354d5c7fbb0e7
  WINDOWS_GCC_SHA256: 84b0ffb1fb194cc41fcfa96fb01d65b3a6289147041cf8bc76db60bd05fbcb6d
  LINUX_ARCHIVE_SHA256: 0ee91c983f2cf3eaa26b444eb553847a7dda34f3fb5d97c34b977ca43e593ca5
  CHIPINTELLI_LINUX_FILE_KEY: 7/20250710/20250710151006-riscv-gcc-9.2.0.tar.gz

jobs:
  windows:
    name: Validate Windows x86 toolchain
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Download validated Windows archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          gh release download v1.0.3 `
            --repo $env:GITHUB_REPOSITORY `
            --dir dist `
            --pattern "riscv-nuclei-elf-gcc-$env:TOOLCHAIN_VERSION-windows.zip"
          $archive = "dist/riscv-nuclei-elf-gcc-$env:TOOLCHAIN_VERSION-windows.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($hash -ne $env:WINDOWS_ARCHIVE_SHA256) {
            throw "Unexpected Windows GCC archive hash: $hash"
          }

      - name: Verify Windows compiler and smoke link
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "dist/riscv-nuclei-elf-gcc-$env:TOOLCHAIN_VERSION-windows.zip"
          Expand-Archive -LiteralPath $archive -DestinationPath extracted
          $root = Resolve-Path 'extracted/gcc_fix_raissrc'
          $gcc = Join-Path $root 'bin/riscv-nuclei-elf-gcc.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $gcc).Hash.ToLowerInvariant()
          if ($hash -ne $env:WINDOWS_GCC_SHA256) {
            throw "Unexpected Windows GCC hash: $hash"
          }
          if ((& $gcc -dumpversion) -ne $env:TOOLCHAIN_VERSION) {
            throw 'Unexpected Windows GCC version.'
          }
          if ((& $gcc -dumpmachine) -ne 'riscv-nuclei-elf') {
            throw 'Unexpected Windows GCC target.'
          }
          'void _start(void) { for (;;) {} }' | Set-Content -Encoding ascii smoke.c
          & $gcc -march=rv32imafc -mabi=ilp32f -Os --specs=nano.specs `
            -nostdlib -nostartfiles '-Wl,-e,_start' smoke.c -o smoke.elf
          if ($LASTEXITCODE -ne 0) { throw 'Windows GCC smoke link failed.' }
          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$archiveHash  $(Split-Path -Leaf $archive)" | Set-Content -Encoding ascii "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: nuclei-gcc-windows
          retention-days: 1
          path: |
            dist/riscv-nuclei-elf-gcc-9.2.0-windows.zip
            dist/riscv-nuclei-elf-gcc-9.2.0-windows.zip.sha256
          if-no-files-found: error

  linux:
    name: Validate ChipIntelli Linux x86_64 toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download pinned ChipIntelli Linux archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist extracted
          response="$RUNNER_TEMP/chipintelli-download.json"
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "file_key=$CHIPINTELLI_LINUX_FILE_KEY" \
            --data-urlencode 'langId=1' \
            https://chipintelli.com/zh-cn/doc/getFileByFileKey \
            > "$response"
          url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["data"]["download_url"])' "$response")"
          source_archive="$RUNNER_TEMP/riscv-gcc-9.2.0.tar.gz"
          curl --fail --location --retry 3 --output "$source_archive" "$url"
          echo "$LINUX_ARCHIVE_SHA256  $source_archive" | sha256sum --check --strict
          cp "$source_archive" "dist/riscv-nuclei-elf-gcc-$TOOLCHAIN_VERSION-linux-x86_64.tar.gz"
          tar -xzf "$source_archive" -C extracted

      - name: Verify Linux compiler and smoke link
        shell: bash
        run: |
          set -euo pipefail
          gcc=extracted/riscv-gcc/bin/riscv-nuclei-elf-gcc
          test "$($gcc -dumpversion)" = "$TOOLCHAIN_VERSION"
          test "$($gcc -dumpmachine)" = riscv-nuclei-elf
          $gcc --print-multi-lib | grep -Fq 'rv32imafc/ilp32f'
          printf '%s\n' 'int main(void) { return 0; }' > smoke.c
          "$gcc" -march=rv32imafc -mabi=ilp32f -Os --specs=nano.specs smoke.c -o smoke.elf
          cd dist
          sha256sum "riscv-nuclei-elf-gcc-$TOOLCHAIN_VERSION-linux-x86_64.tar.gz" \
            > "riscv-nuclei-elf-gcc-$TOOLCHAIN_VERSION-linux-x86_64.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: nuclei-gcc-linux
          retention-days: 1
          path: |
            dist/riscv-nuclei-elf-gcc-9.2.0-linux-x86_64.tar.gz
            dist/riscv-nuclei-elf-gcc-9.2.0-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  macos:
    name: Build macOS x86_64 toolchain
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install gawk gnu-sed gmp mpfr libmpc isl zlib expat texinfo gcc@14
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"

      - name: Check out Nuclei GCC source
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch "$NUCLEI_SOURCE_TAG" --depth 1 --single-branch \
            https://github.com/riscv-mcu/riscv-gnu-toolchain.git source
          git -C source submodule update --init --depth 1 \
            riscv-binutils riscv-gcc riscv-newlib

      - name: Add Nuclei target alias to legacy GCC config.sub
        shell: bash
        run: |
          set -euo pipefail
          config_sub=source/riscv-gcc/config.sub
          if ! "$config_sub" riscv-nuclei-elf >/dev/null 2>&1; then
            python3 - "$config_sub" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding='utf-8')
          needle = '| riscv32-* | riscv64-* \\\n'
          replacement = '| riscv-* | riscv32-* | riscv64-* \\\n'
          if source.count(needle) != 1:
              raise SystemExit(f'Unable to locate the legacy RISC-V machine pattern in {path}')
          with path.open('w', encoding='utf-8', newline='\n') as stream:
              stream.write(source.replace(needle, replacement))
          PY
          fi
          test "$("$config_sub" riscv-nuclei-elf)" = riscv-nuclei-elf

      - name: Build Nuclei GCC 9.2.0
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/riscv-gcc"
          host_gcc="$(brew --prefix gcc@14)/bin/gcc-14"
          host_gxx="$(brew --prefix gcc@14)/bin/g++-14"
          test -x "$host_gcc"
          test -x "$host_gxx"
          export CC="$host_gcc"
          export CXX="$host_gxx"
          export CPPFLAGS="-I$(brew --prefix gmp)/include -I$(brew --prefix mpfr)/include -I$(brew --prefix libmpc)/include -I$(brew --prefix isl)/include -I$(brew --prefix zlib)/include -I$(brew --prefix expat)/include"
          export LDFLAGS="-L$(brew --prefix gmp)/lib -L$(brew --prefix mpfr)/lib -L$(brew --prefix libmpc)/lib -L$(brew --prefix isl)/lib -L$(brew --prefix zlib)/lib -L$(brew --prefix expat)/lib"
          mkdir build
          cd build
          ../source/configure \
            --prefix="$prefix" \
            --with-arch=rv32gc \
            --with-abi=ilp32d \
            --enable-multilib \
            --disable-gdb \
            --disable-gcc-checking
          make -j"$(sysctl -n hw.logicalcpu)" \
            NEWLIB_TUPLE=riscv-nuclei-elf \
            BINUTILS_TARGET_FLAGS_EXTRA=--with-system-zlib

      - name: Bundle Homebrew runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/riscv-gcc"
          host_lib="$prefix/lib/host"
          mkdir -p "$host_lib"

          changed=1
          while [[ "$changed" -eq 1 ]]; do
            changed=0
            while IFS= read -r -d '' binary; do
              if ! file "$binary" | grep -q 'Mach-O'; then
                continue
              fi
              while IFS= read -r dependency; do
                case "$dependency" in
                  /usr/local/*|/opt/homebrew/*)
                    name="$(basename "$dependency")"
                    if [[ ! -f "$host_lib/$name" ]]; then
                      cp -L "$dependency" "$host_lib/$name"
                      chmod u+w "$host_lib/$name"
                      changed=1
                    fi
                    install_name_tool -change "$dependency" "@rpath/$name" "$binary"
                    ;;
                esac
              done < <(otool -L "$binary" | tail -n +2 | awk '{print $1}')
            done < <(find "$prefix" -type f -print0)
          done

          while IFS= read -r -d '' binary; do
            if ! file "$binary" | grep -q 'Mach-O'; then
              continue
            fi
            relative="$(python3 -c 'import os,sys; print(os.path.relpath(sys.argv[1], sys.argv[2]))' "$host_lib" "$(dirname "$binary")")"
            install_name_tool -add_rpath "@loader_path/$relative" "$binary" 2>/dev/null || true
          done < <(find "$prefix" -type f -print0)
          while IFS= read -r -d '' library; do
            install_name_tool -id "@rpath/$(basename "$library")" "$library"
          done < <(find "$host_lib" -type f -name '*.dylib' -print0)

          unresolved="$(find "$prefix" -type f -print0 | while IFS= read -r -d '' binary; do
            if file "$binary" | grep -q 'Mach-O'; then
              otool -L "$binary" | tail -n +2 | awk '{print $1}' | grep -E '^(/usr/local|/opt/homebrew)/' || true
            fi
          done)"
          test -z "$unresolved"

      - name: Verify and package macOS compiler
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/riscv-gcc"
          gcc="$prefix/bin/riscv-nuclei-elf-gcc"
          test "$($gcc -dumpversion)" = "$TOOLCHAIN_VERSION"
          test "$($gcc -dumpmachine)" = riscv-nuclei-elf
          $gcc --print-multi-lib | grep -Fq 'rv32imafc/ilp32f'
          printf '%s\n' 'int main(void) { return 0; }' > smoke.c
          "$gcc" -march=rv32imafc -mabi=ilp32f -Os --specs=nano.specs smoke.c -o smoke.elf
          mkdir -p dist package
          cp -R "$prefix" package/riscv-gcc
          printf '%s\n' \
            "source=https://github.com/riscv-mcu/riscv-gnu-toolchain/tree/$NUCLEI_SOURCE_TAG" \
            "target=riscv-nuclei-elf" \
            "gcc=$TOOLCHAIN_VERSION" \
            "host=x86_64-apple-darwin" \
            "builder=gcc-14" \
            > package/riscv-gcc/BUILD-INFO.txt
          archive="dist/riscv-nuclei-elf-gcc-$TOOLCHAIN_VERSION-macos-x86_64.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C package riscv-gcc
          cd dist
          shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: nuclei-gcc-macos
          retention-days: 1
          path: |
            dist/riscv-nuclei-elf-gcc-9.2.0-macos-x86_64.tar.gz
            dist/riscv-nuclei-elf-gcc-9.2.0-macos-x86_64.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish host-tool release
    if: ${{ inputs.publish }}
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict ./*.sha256

      - name: Create immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; use a new tag instead of replacing host tools." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nuclei GCC $TOOLCHAIN_VERSION host tools" \
            --notes "Windows and Linux vendor GCC 9.2.0 packages plus a reproducible macOS x86_64 build from Nuclei v9.2RC."
